name: Build signed macOS installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-production-release
  cancel-in-progress: false

jobs:
  build_candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NODE_DIST_VERSION: "22.23.1"
      NODE_DARWIN_ARM64_SHA256: fb526811860f81dcac7dd8b2b55eca4accfc5d61c3b7c2508f2639faee8a738d
      NODE_DARWIN_X64_SHA256: efeec6641a2f15f5396d27cd0b32f5062d6689d1e9e5d89607d0b29bda890233
      OUR_CHOICE_BUILD_VERSION: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NODE_DIST_VERSION" != "22.23.1" ]]; then
            echo "The embedded Node version must remain pinned to 22.23.1." >&2
            exit 1
          fi
          xcode_version="$(xcodebuild -version)"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 26.6" ]]; then
            echo "Expected Xcode 26.6, got: $xcode_version" >&2
            exit 1
          fi
          xcrun --find safari-web-extension-packager

      - name: Install dependencies
        run: npm ci

      - name: Test website and desktop sources
        run: |
          npm run lint
          npm test
          npm run mac:check
          npm run mac:safari:check
          npm run mac:build
          OUR_CHOICE_NETWORK_TEST=1 node --test \
            tests/macos-runtime.test.mjs \
            tests/macos-native-shell.test.mjs

      - name: Download and verify Universal Node inputs
        shell: bash
        run: |
          set -euo pipefail
          download_directory="$RUNNER_TEMP/node-distributions"
          release_url="https://nodejs.org/download/release/v${NODE_DIST_VERSION}"
          mkdir -p "$download_directory"

          for architecture in arm64 x64
          do
            archive="node-v${NODE_DIST_VERSION}-darwin-${architecture}.tar.xz"
            case "$architecture" in
              arm64) expected_sha256="$NODE_DARWIN_ARM64_SHA256" ;;
              x64) expected_sha256="$NODE_DARWIN_X64_SHA256" ;;
              *) exit 1 ;;
            esac
            curl --fail --silent --show-error --location \
              --retry 3 --proto '=https' --tlsv1.2 \
              "$release_url/$archive" \
              --output "$download_directory/$archive"
            pushd "$download_directory" >/dev/null
            printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 -c -
            tar -xJf "$archive"
            popd >/dev/null
          done

          echo "OUR_CHOICE_NODE_ARM64=$download_directory/node-v${NODE_DIST_VERSION}-darwin-arm64/bin/node" >> "$GITHUB_ENV"
          echo "OUR_CHOICE_NODE_X64=$download_directory/node-v${NODE_DIST_VERSION}-darwin-x64/bin/node" >> "$GITHUB_ENV"

      - name: Prepare and smoke frozen release candidate
        run: |
          node scripts/prepare-macos-release.mjs
          node scripts/smoke-macos-runtime.mjs "build/macos/Our Choice-release-prepared.app"

      - name: Archive frozen release candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Our-Choice-release-candidate.tar.gz"
          tar -czf "$archive" -C build/macos \
            "Our Choice-release-prepared.app" \
            "Our-Choice-release-prepared.integrity.json"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256"

      - name: Upload frozen release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Our-Choice-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Our-Choice-release-candidate.tar.gz
            ${{ runner.temp }}/Our-Choice-release-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  apple_sign:
    needs: build_candidate
    if: github.ref == 'refs/heads/main'
    environment:
      name: macos-release
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OUR_CHOICE_APP_SIGN_IDENTITY: ${{ vars.OUR_CHOICE_APP_SIGN_IDENTITY }}
      OUR_CHOICE_INSTALLER_SIGN_IDENTITY: ${{ vars.OUR_CHOICE_INSTALLER_SIGN_IDENTITY }}
      OUR_CHOICE_DEVELOPMENT_TEAM: ${{ vars.OUR_CHOICE_DEVELOPMENT_TEAM }}

    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"

      - name: Download frozen release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Our-Choice-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate

      - name: Validate and extract frozen release candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_directory="$RUNNER_TEMP/release-candidate"
          archive="$candidate_directory/Our-Choice-release-candidate.tar.gz"
          listing="$candidate_directory/archive-listing.txt"
          cd "$candidate_directory"
          shasum -a 256 -c Our-Choice-release-candidate.tar.gz.sha256
          tar -tzf "$archive" > "$listing"
          while IFS= read -r archive_entry_details
          do
            case "${archive_entry_details:0:1}" in
              d|-) ;;
              *)
                echo "Release-candidate archive contains a link or unsupported entry: $archive_entry_details" >&2
                exit 1
                ;;
            esac
          done < <(tar -tvzf "$archive")
          while IFS= read -r entry
          do
            if [[ "$entry" == /* \
              || "$entry" == ".." \
              || "$entry" == ../* \
              || "$entry" == */../* \
              || "$entry" == */.. ]]; then
              echo "Unsafe release-candidate archive path: $entry" >&2
              exit 1
            fi
            case "$entry" in
              "Our Choice-release-prepared.app"|\
              "Our Choice-release-prepared.app/"|\
              "Our Choice-release-prepared.app/"*|\
              "Our-Choice-release-prepared.integrity.json") ;;
              *)
                echo "Unexpected release-candidate archive path: $entry" >&2
                exit 1
                ;;
            esac
          done < "$listing"
          mkdir -p "$GITHUB_WORKSPACE/build/macos"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE/build/macos"
          node scripts/macos-release-candidate.mjs \
            "build/macos/Our Choice-release-prepared.app" \
            "build/macos/Our-Choice-release-prepared.integrity.json"

      - name: Verify signing environment
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in \
            OUR_CHOICE_APP_SIGN_IDENTITY \
            OUR_CHOICE_INSTALLER_SIGN_IDENTITY \
            OUR_CHOICE_DEVELOPMENT_TEAM
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing macos-release variable: $variable_name" >&2
              exit 1
            fi
          done
          xcode_version="$(xcodebuild -version)"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 26.6" ]]; then
            echo "Expected Xcode 26.6, got: $xcode_version" >&2
            exit 1
          fi

      - name: Import Developer ID certificates
        shell: bash
        env:
          MACOS_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for secret_name in \
            MACOS_APPLICATION_CERTIFICATE_BASE64 \
            MACOS_APPLICATION_CERTIFICATE_PASSWORD \
            MACOS_INSTALLER_CERTIFICATE_BASE64 \
            MACOS_INSTALLER_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing macos-release secret: $secret_name" >&2
              exit 1
            fi
          done

          application_p12="$RUNNER_TEMP/application-certificate.p12"
          installer_p12="$RUNNER_TEMP/installer-certificate.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          security default-keychain -d user > "$RUNNER_TEMP/original-default-keychain.txt"
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          printf '%s' "$MACOS_APPLICATION_CERTIFICATE_BASE64" | base64 --decode -o "$application_p12"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$installer_p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode -o "$notary_key"
          chmod 600 "$application_p12" "$installer_p12" "$notary_key"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$application_p12" \
            -k "$keychain" -P "$MACOS_APPLICATION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security import "$installer_p12" \
            -k "$keychain" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          security find-certificate -c "$OUR_CHOICE_APP_SIGN_IDENTITY" "$keychain" >/dev/null
          security find-certificate -c "$OUR_CHOICE_INSTALLER_SIGN_IDENTITY" "$keychain" >/dev/null

      - name: Sign and notarize frozen installer candidate
        env:
          OUR_CHOICE_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          OUR_CHOICE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          OUR_CHOICE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          node scripts/package-macos.mjs \
            --manual-chrome-install \
            --out build/macos/Our-Choice-notarized-candidate.pkg

      - name: Remove signing credentials
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_failed=0
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          original_default_file="$RUNNER_TEMP/original-default-keychain.txt"
          original_list_file="$RUNNER_TEMP/original-keychains.txt"
          if [[ -s "$original_default_file" && -s "$original_list_file" ]]; then
            original_default="$(sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/' "$original_default_file")"
            original_keychains=()
            while IFS= read -r keychain_line
            do
              keychain_path="$(sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/' <<< "$keychain_line")"
              if [[ -n "$keychain_path" ]]; then
                original_keychains+=("$keychain_path")
              fi
            done < "$original_list_file"
            if [[ -z "$original_default" ]] \
              || ! security default-keychain -d user -s "$original_default" \
              || (( ${#original_keychains[@]} == 0 )) \
              || ! security list-keychains -d user -s "${original_keychains[@]}"
            then
              cleanup_failed=1
            fi
          else
            cleanup_failed=1
          fi
          if [[ -f "$keychain" ]]; then
            if ! security lock-keychain "$keychain"; then
              cleanup_failed=1
            fi
            if ! security delete-keychain "$keychain"; then
              cleanup_failed=1
            fi
          fi
          for credential_path in \
            "$RUNNER_TEMP/application-certificate.p12" \
            "$RUNNER_TEMP/installer-certificate.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/original-default-keychain.txt" \
            "$RUNNER_TEMP/original-keychains.txt"
          do
            if ! rm -f "$credential_path"; then
              cleanup_failed=1
            fi
          done
          if [[ -e "$keychain" ]]; then
            cleanup_failed=1
          fi
          if (( cleanup_failed != 0 )); then
            echo "Failed to remove all signing credentials" >&2
            exit 1
          fi

      - name: Upload notarization diagnostics
        if: ${{ failure() && steps.cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Our-Choice-notarization-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/macos/Our-Choice-notarized-candidate.notary.json
            build/macos/Our-Choice-notarized-candidate.notary-log.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload signed notarized candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Our-Choice-signed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/macos/Our-Choice-notarized-candidate.pkg
            build/macos/Our-Choice-notarized-candidate.notary.json
            build/macos/Our-Choice-notarized-candidate.notary-log.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  verify_candidate:
    needs: apple_sign
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OUR_CHOICE_DEVELOPMENT_TEAM: ${{ vars.OUR_CHOICE_DEVELOPMENT_TEAM }}

    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"

      - name: Download signed notarized candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Our-Choice-signed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/macos

      - name: Verify candidate without signing credentials
        run: |
          node scripts/verify-macos-package.mjs \
            build/macos/Our-Choice-notarized-candidate.pkg \
            --manual-chrome-install
          cd build/macos
          shasum -a 256 Our-Choice-notarized-candidate.pkg \
            > Our-Choice-notarized-candidate.pkg.sha256

      - name: Upload candidate verification attestation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Our-Choice-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/macos/Our-Choice-notarized-candidate.pkg.sha256
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [apple_sign, verify_candidate]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 15

    steps:
      - name: Download verified signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Our-Choice-signed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/macos

      - name: Download candidate verification attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Our-Choice-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/attestation

      - name: Promote verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cd build/macos
          shasum -a 256 -c ../attestation/Our-Choice-notarized-candidate.pkg.sha256
          mv Our-Choice-notarized-candidate.pkg Our-Choice.pkg
          mv Our-Choice-notarized-candidate.notary.json Our-Choice.notary.json
          mv Our-Choice-notarized-candidate.notary-log.json Our-Choice.notary-log.json
          shasum -a 256 Our-Choice.pkg > Our-Choice.pkg.sha256

      - name: Upload verified installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Our-Choice-macOS-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/macos/Our-Choice.pkg
            build/macos/Our-Choice.pkg.sha256
            build/macos/Our-Choice.notary.json
            build/macos/Our-Choice.notary-log.json
          if-no-files-found: error
          compression-level: 0
