services:
  workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    init: true
    volumes:
      - ..:/workspaces/our-choice:cached
    working_dir: /workspaces/our-choice
    command: sleep infinity
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      RSSHUB_BASE_URL: http://rsshub:1200
      RSSHUB_ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-}
    depends_on:
      rsshub:
        condition: service_started

  rsshub:
    image: ghcr.io/diygod/rsshub:chromium-bundled
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-}
      BILIBILI_COOKIE_1: ${BILIBILI_COOKIE_1:-}
      ZHIHU_COOKIES: ${ZHIHU_COOKIES:-}
      XIAOHONGSHU_COOKIE: ${XIAOHONGSHU_COOKIE:-}
      WEIBO_COOKIES: ${WEIBO_COOKIES:-}
      XIMALAYA_TOKEN: ${XIMALAYA_TOKEN:-}
    expose:
      - "1200"
    restart: unless-stopped
